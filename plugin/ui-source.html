<!doctype html>
<html lang="ru"><meta charset="utf-8">
<style>
body { font: 12px system-ui; margin: 20px; background: var(--figma-color-bg, #fff); color: var(--figma-color-text, #222) }
label { display: block; margin: 12px 0 5px } input { box-sizing: border-box; width: 100%; padding: 8px }
button { margin: 12px 4px 0 0; padding: 7px 12px } #status { overflow-wrap: anywhere } p { line-height: 1.5 }
</style>
<strong>Figma → Kilo Code</strong>
<p>Откройте MCP в Kilo и выделите фрейм. Секрет находится в локальном файле pairing.txt после установки.</p>
<label for="secret">Секрет подключения</label><input id="secret" type="password" autocomplete="off" spellcheck="false">
<button id="connect">Подключить</button><button id="disconnect">Отключить</button>
<p id="status" role="status">Не подключено · 127.0.0.1:3055</p>
<script>
let socket;
const status = document.getElementById('status');
const notifyDisconnect = () => parent.postMessage({ pluginMessage: { type: 'disconnect' } }, '*');
function disconnect() { if (socket) { const previous = socket; socket = undefined; previous.close(); } notifyDisconnect(); }
document.getElementById('disconnect').onclick = () => { disconnect(); status.textContent = 'Отключено'; };
document.getElementById('connect').onclick = () => {
  const secret = document.getElementById('secret').value.trim();
  if (secret.length < 32) { status.textContent = 'Введите секрет из pairing.txt'; return; }
  disconnect();
  const ws = new WebSocket('ws://127.0.0.1:3055'); socket = ws;
  status.textContent = 'Подключение…';
  ws.onopen = () => { if (socket === ws) ws.send(JSON.stringify({ type: 'auth', secret })); };
  ws.onmessage = event => {
    if (socket !== ws) return;
    try {
      if (typeof event.data !== 'string' || event.data.length > 64000) throw Error();
      const message = JSON.parse(event.data);
      if (message.type === 'ready') { status.textContent = 'Подключено. Можно обращаться к макету из Kilo.'; document.getElementById('secret').value = ''; }
      else if (message.type === 'request') parent.postMessage({ pluginMessage: message }, '*');
    } catch { ws.close(); }
  };
  ws.onerror = () => { if (socket === ws) status.textContent = 'Нет соединения. Проверьте, что MCP запущен в Kilo.'; };
  ws.onclose = () => { if (socket === ws) { socket = undefined; notifyDisconnect(); status.textContent = 'Отключено. Проверьте секрет и MCP, затем подключитесь снова.'; } };
};
window.onmessage = event => {
  if (event.source !== parent) return;
  const message = event.data.pluginMessage;
  if (message?.type !== 'response' || socket?.readyState !== WebSocket.OPEN) return;
  const data = JSON.stringify(message);
  if (data.length > 6 * 1024 * 1024) socket.send(JSON.stringify({ type: 'response', id: message.id, error: 'Response too large' }));
  else socket.send(data);
};
</script></html>
